name: Create a New Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - feature
          - yearly
          - rc

run-name: "Release ${{ inputs.bump }} bump on ${{ github.ref_name }}"

permissions:
  contents: write

jobs:
  release:
    uses: valkyrjaio/.github/.github/workflows/_java-create-release.yml@fbf1e4db594578f8ea0c95ac8561cecb3c7a96c2
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}
      dependencies: |
        [
          {"name": "Spotless",    "directory": ".github/ci/spotless"},
          {"name": "ArchUnit",    "directory": ".github/ci/archunit"},
          {"name": "ErrorProne",  "directory": ".github/ci/errorprone"},
          {"name": "SpotBugs",    "directory": ".github/ci/spotbugs"},
          {"name": "JUnit",       "directory": ".github/ci/junit"}
        ]
      info-class-path: src/main/java/io/valkyrja/spotless/constant/SpotlessInfo.java
      info-class-name: SpotlessInfo

  # Maven Central receives the jar, which a `buildscript { classpath(...) }` consumer and a
  # dependency scanner resolve. The plugin marker goes to the Gradle Plugin Portal alone, which the
  # root build script states.
  publish:
    needs: release
    uses: valkyrjaio/.github/.github/workflows/_java-release-maven-publish.yml@fbf1e4db594578f8ea0c95ac8561cecb3c7a96c2
    secrets:
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  # The Portal receives the plugin marker and the jar. It is Gradle's default plugin repository, so
  # a consuming build resolves `id("io.valkyrja.ci-spotless")` without a `pluginManagement` block.
  publish-plugin-portal:
    needs: release
    uses: valkyrjaio/.github/.github/workflows/_java-release-plugin-portal-publish.yml@fbf1e4db594578f8ea0c95ac8561cecb3c7a96c2
    secrets:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
